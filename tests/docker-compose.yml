version: '3.8'

services:
  jfrog-mock:
    image: wiremock/wiremock:latest
    container_name: jfrog-mock
    ports:
      - "8081:8080"
    command: ["--global-response-templating", "--disable-gzip"]
    volumes:
      - ./fixtures/jfrog_mappings:/home/wiremock/mappings
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/__admin/health"]
      interval: 5s
      timeout: 5s
      retries: 10

  nexus-mock:
    image: wiremock/wiremock:latest
    container_name: nexus-mock
    ports:
      - "8082:8080"
    command: ["--global-response-templating", "--disable-gzip"]
    volumes:
      - ./fixtures/nexus_mappings:/home/wiremock/mappings
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/__admin/health"]
      interval: 5s
      timeout: 5s
      retries: 10
