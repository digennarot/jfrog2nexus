name: Auto Release

on:
  push:
    branches:
      - master
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build Binaries
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: jfrog2nexus-linux-x86_64
            is_windows: false
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact_name: jfrog2nexus-macos-x86_64
            is_windows: false
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: jfrog2nexus-macos-aarch64
            is_windows: false
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: jfrog2nexus-windows-x86_64.exe
            is_windows: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Set up Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Prepare binary (Linux/macOS)
        if: ${{ !matrix.is_windows }}
        run: mv target/${{ matrix.target }}/release/jfrog2nexus ${{ matrix.artifact_name }}

      - name: Prepare binary (Windows)
        if: ${{ matrix.is_windows }}
        shell: bash
        run: mv target/${{ matrix.target }}/release/jfrog2nexus.exe ${{ matrix.artifact_name }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_name }}
          retention-days: 1

  publish-release:
    name: Automate Release Creation
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Provide execution permissions (Linux/macOS)
        run: |
          chmod +x release-artifacts/jfrog2nexus-linux-x86_64 || true
          chmod +x release-artifacts/jfrog2nexus-macos-x86_64 || true
          chmod +x release-artifacts/jfrog2nexus-macos-aarch64 || true

      - name: Determine Release Info
        id: release_info
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "tag_name=${{ github.ref_name }}" >> $GITHUB_ENV
            echo "release_name=Release ${{ github.ref_name }}" >> $GITHUB_ENV
            
            if [[ "${{ github.ref_name }}" == *"-alpha"* || "${{ github.ref_name }}" == *"-beta"* || "${{ github.ref_name }}" == *"-rc"* ]]; then
              echo "is_prerelease=true" >> $GITHUB_ENV
            else
              echo "is_prerelease=false" >> $GITHUB_ENV
            fi
            
          else
            echo "tag_name=nightly-${{ github.sha }}" >> $GITHUB_ENV
            echo "release_name=Nightly Build (${{ github.sha }})" >> $GITHUB_ENV
            echo "is_prerelease=true" >> $GITHUB_ENV
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.tag_name }}
          name: ${{ env.release_name }}
          files: release-artifacts/*
          generate_release_notes: true
          draft: false
          prerelease: ${{ env.is_prerelease == 'true' }}
          make_latest: ${{ env.is_prerelease == 'false' }}

